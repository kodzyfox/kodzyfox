    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #8B949E; }
    .bar { fill: #1DB954; }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="379" height="83" rx="10" fill="#0D1117" stroke="#30363D"/>

  <!-- Spotify Icon -->
  <g transform="translate(18, 22)">
    <circle cx="20" cy="20" r="20" fill="#1DB954"/>
    <path d="M29.5 17.2C23.6 13.7 13.8 13.4 8.1 15.1C7.2 15.4 6.2 14.8 6.0 13.9C5.7 13.0 6.3 12.0 7.2 11.8C13.8 9.8 24.6 10.1 31.4 14.2C32.2 14.7 32.5 15.7 32.0 16.5C31.5 17.3 30.4 17.6 29.5 17.2ZM29.2 22.7C28.8 23.4 27.9 23.6 27.2 23.2C22.3 20.2 14.7 19.3 8.8 21.1C8.0 21.3 7.2 20.9 6.9 20.1C6.7 19.3 7.2 18.5 7.9 18.2C14.7 16.2 23.1 17.1 28.7 20.6C29.4 21.0 29.6 22.0 29.2 22.7ZM26.9 28.0C26.6 28.5 25.9 28.7 25.4 28.3C21.2 25.8 15.7 25.2 9.2 26.7C8.6 26.8 8.0 26.4 7.9 25.8C7.7 25.2 8.1 24.6 8.7 24.5C15.8 22.9 21.9 23.5 26.6 26.4C27.1 26.7 27.2 27.4 26.9 28.0Z" fill="#0D1117"/>
  </g>

  <!-- Text Info -->
  <text x="72" y="38" class="title">Currently Vibe-Coding</text>
  <text x="72" y="56" class="subtitle">Soundtrack synced with AURA</text>

