  <g transform="translate(315, 27)">
    <rect class="bar" x="0" y="10" width="3.5" height="15" rx="1.75">
      <animate attributeName="height" values="8;26;12;28;8" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="19;1;15;0;19" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="7" y="5" width="3.5" height="20" rx="1.75">
      <animate attributeName="height" values="22;8;28;14;22" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;19;0;13;5" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="14" y="15" width="3.5" height="10" rx="1.75">
      <animate attributeName="height" values="14;28;6;20;14" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="13;0;21;7;13" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="21" y="8" width="3.5" height="18" rx="1.75">
      <animate attributeName="height" values="26;12;24;8;26" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="1;15;3;19;1" dur="1.3s" repeatCount="indefinite"/>
